<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow, noarchive" />
		<title>暂时关闭</title>
		<style>
			:root {
				color-scheme: dark;
				font-family:
					Inter, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei",
					system-ui, sans-serif;
				background: #071323;
				color: #e7edf7;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				background:
					linear-gradient(135deg, rgba(23, 57, 102, 0.45), transparent 42%),
					#071323;
			}

			main {
				width: min(88vw, 34rem);
				padding: 3rem 2rem;
				border: 1px solid rgba(231, 237, 247, 0.14);
				border-radius: 1rem;
				background: rgba(8, 20, 36, 0.72);
				box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.28);
				text-align: center;
			}

			h1 {
				margin: 0 0 0.8rem;
				font-size: clamp(1.9rem, 5vw, 3rem);
				letter-spacing: 0;
			}

			p {
				margin: 0;
				color: rgba(231, 237, 247, 0.72);
				line-height: 1.75;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>网站暂时关闭</h1>
			<p>当前博客暂停公开访问。源文件已保留，之后可以随时恢复部署。</p>
		</main>
	</body>
</html>
